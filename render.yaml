# ─── Render Blueprint ─────────────────────────────────────────
# This file defines the Prompza web service for Render.
# To deploy: connect your GitHub repo → Render auto-detects this file.

services:
  - type: web
    name: prompza
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: prompza
      - key: PUBLIC_APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_TTL_HOURS
        value: 12
      - key: ADMIN_SUSPICIOUS_LOGIN_THRESHOLD
        value: 3
      - key: ADMIN_ALERT_BOT_TOKEN
        sync: false
      - key: ADMIN_ALERT_CHAT_ID
        sync: false
      - key: REQUEST_BOT_TOKEN
        sync: false
      - key: REQUEST_BOT_CHAT_ID
        sync: false
      - key: ACTIVITY_BOT_TOKEN
        sync: false
      - key: ACTIVITY_BOT_CHAT_ID
        sync: false
