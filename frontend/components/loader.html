<section class="prompza-loader" id="prompza-loader" aria-live="polite" aria-label="Loading">
    <style>
        .prompza-loader {
            --loader-bg: radial-gradient(circle at top, rgba(15, 82, 186, 0.14) 0%, rgba(15, 82, 186, 0) 30%),
                linear-gradient(145deg, #ffffff 0%, #f8fbff 44%, #d6e6f3 100%);
            --loader-surface: rgba(255, 255, 255, 0.68);
            --loader-border: rgba(15, 82, 186, 0.12);
            --loader-text: #000026;
            --loader-soft: rgba(0, 0, 38, 0.62);
            --loader-glow: #d6e6f3;
            --loader-accent: #a6c5d7;
            --loader-strong: #0f52ba;
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            padding: 24px;
            overflow: hidden;
            background: var(--loader-bg);
            font-family: "DM Sans", Arial, sans-serif;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        .prompza-loader.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .prompza-loader__grid,
        .prompza-loader__aura {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .prompza-loader__grid {
            background-image:
                linear-gradient(rgba(15, 82, 186, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 82, 186, 0.08) 1px, transparent 1px);
            background-size: 72px 72px;
            mask-image: radial-gradient(circle at center, black 38%, transparent 78%);
            opacity: 0.5;
            animation: loader-grid-drift 16s linear infinite;
        }

        .prompza-loader__aura::before,
        .prompza-loader__aura::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(10px);
        }

        .prompza-loader__aura::before {
            top: 18%;
            left: 20%;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(166, 197, 215, 0.26) 0%, rgba(166, 197, 215, 0) 72%);
            animation: loader-float 7s ease-in-out infinite;
        }

        .prompza-loader__aura::after {
            right: 16%;
            bottom: 14%;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(15, 82, 186, 0.14) 0%, rgba(15, 82, 186, 0) 70%);
            animation: loader-float 9s ease-in-out infinite reverse;
        }

        .prompza-loader__panel {
            position: relative;
            width: min(100%, 560px);
            padding: 34px 30px 28px;
            border: 1px solid var(--loader-border);
            border-radius: 30px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(246, 251, 255, 0.72) 100%),
                var(--loader-surface);
            box-shadow:
                0 30px 80px rgba(15, 82, 186, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(22px);
            overflow: hidden;
        }

        .prompza-loader__panel::before {
            content: "";
            position: absolute;
            inset: auto -20% -55% auto;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(214, 230, 243, 0.32) 0%, rgba(214, 230, 243, 0) 74%);
            pointer-events: none;
        }

        .prompza-loader__topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
        }

        .prompza-loader__tag {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(15, 82, 186, 0.06);
            color: var(--loader-soft);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .prompza-loader__dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--loader-glow);
            box-shadow: 0 0 18px rgba(15, 82, 186, 0.24);
            animation: loader-pulse 1.4s ease-in-out infinite;
        }

        .prompza-loader__percent {
            color: var(--loader-text);
            font-family: "Syne", Arial, sans-serif;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            font-weight: 800;
            line-height: 1;
        }

        .prompza-loader__core {
            position: relative;
            display: grid;
            place-items: center;
            width: 230px;
            height: 230px;
            margin: 0 auto 28px;
        }

        .prompza-loader__ring,
        .prompza-loader__ring::before,
        .prompza-loader__ring::after {
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }

        .prompza-loader__ring {
            border: 1px solid rgba(15, 82, 186, 0.12);
            box-shadow: inset 0 0 26px rgba(15, 82, 186, 0.04);
        }

        .prompza-loader__ring::before,
        .prompza-loader__ring::after {
            content: "";
            inset: 16px;
            border: 1px solid rgba(166, 197, 215, 0.36);
        }

        .prompza-loader__ring::after {
            inset: 36px;
            border-color: rgba(15, 82, 186, 0.28);
        }

        .prompza-loader__spinner {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: rgba(15, 82, 186, 0.88);
            border-right-color: rgba(166, 197, 215, 0.9);
            animation: loader-spin 2.6s linear infinite;
        }

        .prompza-loader__spinner::before,
        .prompza-loader__spinner::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            inset: 18px;
            border: 1px solid transparent;
            border-bottom-color: rgba(214, 230, 243, 0.8);
            border-left-color: rgba(15, 82, 186, 0.55);
            animation: loader-spin 1.8s linear infinite reverse;
        }

        .prompza-loader__spinner::after {
            inset: 42px;
            border-bottom-color: rgba(166, 197, 215, 0.95);
            border-left-color: rgba(15, 82, 186, 0.18);
            animation-duration: 3.8s;
        }

        .prompza-loader__beam {
            position: absolute;
            width: 54%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, rgba(15, 82, 186, 0.88) 50%, transparent 100%);
            box-shadow: 0 0 18px rgba(15, 82, 186, 0.2);
            animation: loader-scan 2.8s ease-in-out infinite;
            transform-origin: center;
        }

        .prompza-loader__center {
            position: relative;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.98) 0%, rgba(214, 230, 243, 0.88) 25%, rgba(15, 82, 186, 0.28) 68%, rgba(15, 82, 186, 0) 100%);
            box-shadow:
                0 0 40px rgba(15, 82, 186, 0.16),
                inset 0 0 20px rgba(255, 255, 255, 0.58);
            animation: loader-breathe 2.6s ease-in-out infinite;
        }

        .prompza-loader__center::before,
        .prompza-loader__center::after {
            content: "";
            position: absolute;
            inset: 50%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .prompza-loader__center::before {
            width: 22px;
            height: 22px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 0 18px rgba(15, 82, 186, 0.16);
        }

        .prompza-loader__center::after {
            width: 118px;
            height: 118px;
            border: 1px solid rgba(15, 82, 186, 0.14);
            animation: loader-ripple 2.2s ease-out infinite;
        }

        .prompza-loader__content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .prompza-loader__title {
            margin-bottom: 10px;
            color: var(--loader-text);
            font-family: "Syne", Arial, sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 800;
            letter-spacing: 0.01em;
        }

        .prompza-loader__subtitle {
            max-width: 420px;
            margin: 0 auto 22px;
            color: var(--loader-soft);
            font-size: 0.96rem;
            line-height: 1.7;
        }

        .prompza-loader__progress {
            position: relative;
            height: 10px;
            margin-bottom: 18px;
            border-radius: 999px;
            background: rgba(15, 82, 186, 0.08);
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .prompza-loader__progress-bar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #d6e6f3 0%, #a6c5d7 45%, #0f52ba 100%);
            box-shadow: 0 0 24px rgba(214, 230, 243, 0.28);
            transition: width 0.18s ease-out;
        }

        .prompza-loader__progress-bar::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.85) 50%, transparent 100%);
            transform: translateX(-100%);
            animation: loader-shimmer 1.8s linear infinite;
        }

        .prompza-loader__meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            color: var(--loader-soft);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .prompza-loader__meta strong {
            color: var(--loader-text);
            font-weight: 700;
        }

        @keyframes loader-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes loader-scan {
            0%,
            100% {
                transform: rotate(0deg) scaleX(0.82);
                opacity: 0.5;
            }

            50% {
                transform: rotate(180deg) scaleX(1.08);
                opacity: 1;
            }
        }

        @keyframes loader-ripple {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.7);
            }

            30% {
                opacity: 0.6;
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.28);
            }
        }

        @keyframes loader-breathe {
            0%,
            100% {
                transform: scale(0.96);
            }

            50% {
                transform: scale(1.06);
            }
        }

        @keyframes loader-shimmer {
            to {
                transform: translateX(100%);
            }
        }

        @keyframes loader-grid-drift {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(72px);
            }
        }

        @keyframes loader-pulse {
            0%,
            100% {
                transform: scale(0.9);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        @keyframes loader-float {
            0%,
            100% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(16px, -18px, 0);
            }
        }

        @media (max-width: 640px) {
            .prompza-loader__panel {
                padding: 26px 20px 22px;
                border-radius: 24px;
            }

            .prompza-loader__topline,
            .prompza-loader__meta {
                flex-direction: column;
                align-items: flex-start;
            }

            .prompza-loader__percent {
                font-size: 1.5rem;
            }

            .prompza-loader__core {
                width: 196px;
                height: 196px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .prompza-loader *,
            .prompza-loader *::before,
            .prompza-loader *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <div class="prompza-loader__grid" aria-hidden="true"></div>
    <div class="prompza-loader__aura" aria-hidden="true"></div>

    <div class="prompza-loader__panel">
        <div class="prompza-loader__topline">
            <span class="prompza-loader__tag">
                <span class="prompza-loader__dot"></span>
                Initializing experience
            </span>
            <span class="prompza-loader__percent" id="prompza-loader-percent">0%</span>
        </div>

        <div class="prompza-loader__core" aria-hidden="true">
            <div class="prompza-loader__ring"></div>
            <div class="prompza-loader__spinner"></div>
            <div class="prompza-loader__beam"></div>
            <div class="prompza-loader__center"></div>
        </div>

        <div class="prompza-loader__content">
            <h1 class="prompza-loader__title">Prompza Is Loading</h1>
            <p class="prompza-loader__subtitle">
                Preparing a clean, bright workspace with layered motion, smooth progress feedback, and a polished light-glass atmosphere.
            </p>

            <div class="prompza-loader__progress" aria-hidden="true">
                <div class="prompza-loader__progress-bar" id="prompza-loader-bar"></div>
            </div>

            <div class="prompza-loader__meta">
                <span>System status: <strong>Streaming assets</strong></span>
                <span id="prompza-loader-step">Calibrating interface</span>
            </div>
        </div>
    </div>

    <script>
        (() => {
            const loader = document.getElementById("prompza-loader");
            const progressBar = document.getElementById("prompza-loader-bar");
            const percent = document.getElementById("prompza-loader-percent");
            const step = document.getElementById("prompza-loader-step");

            if (!loader || !progressBar || !percent || !step) {
                return;
            }

            const steps = [
                "Calibrating interface",
                "Rendering motion layers",
                "Syncing visual assets",
                "Finalizing experience"
            ];

            const startTime = performance.now();
            const minimumDuration = 2400;
            let progress = 0;
            let completed = false;

            const updateStep = (value) => {
                const index = Math.min(steps.length - 1, Math.floor(value / 26));
                step.textContent = steps[index];
            };

            const render = (value) => {
                progressBar.style.width = value + "%";
                percent.textContent = value + "%";
                updateStep(value);
            };

            const hideLoader = () => {
                if (completed) {
                    return;
                }

                completed = true;
                render(100);

                window.setTimeout(() => {
                    loader.classList.add("is-hidden");

                    window.setTimeout(() => {
                        loader.remove();
                    }, 750);
                }, 260);
            };

            const tick = () => {
                if (completed) {
                    return;
                }

                progress += progress < 74 ? Math.random() * 8 : Math.random() * 3.5;
                progress = Math.min(Math.floor(progress), 96);
                render(progress);

                if (!completed) {
                    window.setTimeout(tick, 140 + Math.random() * 120);
                }
            };

            render(0);
            tick();

            const finalizeWhenReady = () => {
                const elapsed = performance.now() - startTime;
                const remaining = Math.max(0, minimumDuration - elapsed);
                window.setTimeout(hideLoader, remaining);
            };

            window.addEventListener("prompza:loader-complete", () => {
                finalizeWhenReady();
            }, { once: true });

            if (document.readyState === "complete") {
                window.setTimeout(finalizeWhenReady, 800);
            } else {
                window.addEventListener("load", () => {
                    window.setTimeout(finalizeWhenReady, 800);
                }, { once: true });
            }

            window.setTimeout(hideLoader, 8000);
        })();
    </script>
</section>
