<section class="prompt-card" aria-labelledby="prompt-card-title">
    <style>
        .prompt-card {
            --card-bg: linear-gradient(160deg, #ffffff 0%, #f6fbff 45%, #d6e6f3 100%);
            --card-border: rgba(15, 82, 186, 0.16);
            --card-shadow: 0 24px 48px rgba(15, 82, 186, 0.14);
            --title-color: #000026;
            --body-color: rgba(0, 0, 38, 0.8);
            --soft-surface: rgba(166, 197, 215, 0.22);
            --accent: #0f52ba;
            --accent-dark: #000026;
            position: relative;
            width: min(100%, 420px);
            padding: 28px;
            border: 1px solid var(--card-border);
            border-radius: 24px;
            background: var(--card-bg);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            font-family: "DM Sans", Arial, sans-serif;
        }

        .prompt-card::before {
            content: "";
            position: absolute;
            inset: -30% auto auto 55%;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(166, 197, 215, 0.45) 0%, rgba(166, 197, 215, 0) 72%);
            pointer-events: none;
        }

        .prompt-card__eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(15, 82, 186, 0.08);
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .prompt-card__title {
            margin-bottom: 14px;
            color: var(--title-color);
            font-family: "Syne", Arial, sans-serif;
            font-size: clamp(1.4rem, 2vw, 1.8rem);
            font-weight: 800;
            line-height: 1.1;
        }

        .prompt-card__body {
            margin-bottom: 18px;
            color: var(--body-color);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .prompt-card__prompt {
            min-height: 180px;
            width: 100%;
            padding: 18px;
            border: 1px solid rgba(15, 82, 186, 0.14);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.72);
            color: var(--accent-dark);
            resize: none;
            outline: none;
            font-family: "DM Sans", Arial, sans-serif;
            font-size: 0.84rem;
            line-height: 1.6;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .prompt-card__prompt::selection {
            background: rgba(15, 82, 186, 0.16);
        }

        .prompt-card__actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
        }

        .prompt-card__like {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid rgba(15, 82, 186, 0.16);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.88);
            color: var(--accent-dark);
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .prompt-card__like:hover,
        .prompt-card__like:focus-visible,
        .prompt-card__like.is-liked {
            transform: translateY(-1px);
            background: rgba(15, 82, 186, 0.12);
            box-shadow: 0 10px 20px rgba(15, 82, 186, 0.12);
        }

        .prompt-card__like:disabled {
            cursor: default;
        }

        .prompt-card__like-icon {
            display: inline-flex;
            color: var(--accent);
        }

        .prompt-card__like-copy {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            line-height: 1.1;
        }

        .prompt-card__like-label {
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: rgba(0, 0, 38, 0.58);
        }

        .prompt-card__like-count {
            font-size: 0.92rem;
            font-weight: 800;
            color: var(--accent-dark);
        }

        .prompt-card__copy-wrap {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .prompt-card__copy {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #0f52ba 0%, #000026 100%);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(0, 0, 38, 0.22);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .prompt-card__copy:hover,
        .prompt-card__copy:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 16px 28px rgba(0, 0, 38, 0.28);
        }

        .prompt-card__copy:focus-visible {
            outline: 3px solid rgba(166, 197, 215, 0.9);
            outline-offset: 3px;
        }

        .prompt-card__copy-status {
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.92);
            color: var(--accent-dark);
            font-size: 0.76rem;
            font-weight: 700;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.18s ease, transform 0.18s ease;
            pointer-events: none;
        }

        .prompt-card__copy-status.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 520px) {
            .prompt-card {
                width: 100%;
                padding: 20px;
                border-radius: 18px;
            }

            .prompt-card__title {
                font-size: 1.25rem;
            }

            .prompt-card__body {
                font-size: 0.88rem;
                margin-bottom: 14px;
            }

            .prompt-card__prompt {
                min-height: 140px;
                padding: 14px;
                font-size: 0.82rem;
                border-radius: 14px;
            }

            .prompt-card__actions {
                flex-wrap: wrap;
                gap: 10px;
            }

            .prompt-card__like {
                padding: 8px 12px;
            }

            .prompt-card__copy {
                width: 42px;
                height: 42px;
                border-radius: 12px;
            }

            .prompt-card__eyebrow {
                font-size: 0.72rem;
                padding: 6px 10px;
                margin-bottom: 10px;
            }
        }
    </style>

    <span class="prompt-card__eyebrow">General</span>
    <h2 class="prompt-card__title" id="prompt-card-title">Instagram Caption Generator</h2>
    <p class="prompt-card__body">
        A clean prompt space for quick copy and paste use.
    </p>

    <textarea class="prompt-card__prompt js-prompt-card-text" readonly>Write 3 polished Instagram captions for a new product launch. Keep the tone modern, confident, and friendly. Add one short call to action and 5 relevant hashtags for each caption.</textarea>

    <div class="prompt-card__actions">
        <button class="prompt-card__like js-prompt-card-like" type="button" aria-label="Like prompt">
            <span class="prompt-card__like-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M12 20.25s-7.5-4.35-7.5-10.05A4.2 4.2 0 0 1 8.7 6a4.73 4.73 0 0 1 3.3 1.35A4.73 4.73 0 0 1 15.3 6a4.2 4.2 0 0 1 4.2 4.2c0 5.7-7.5 10.05-7.5 10.05Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <span class="prompt-card__like-copy">
                <span class="prompt-card__like-label">Likes</span>
                <span class="prompt-card__like-count js-prompt-card-like-count">0</span>
            </span>
        </button>

        <div class="prompt-card__copy-wrap">
            <span class="prompt-card__copy-status js-prompt-card-status" aria-live="polite">Copied</span>
            <button class="prompt-card__copy js-prompt-card-copy" type="button" aria-label="Copy prompt">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M9 9.75A2.25 2.25 0 0 1 11.25 7.5h6A2.25 2.25 0 0 1 19.5 9.75v7.5a2.25 2.25 0 0 1-2.25 2.25h-6A2.25 2.25 0 0 1 9 17.25v-7.5Z" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M6.75 16.5A2.25 2.25 0 0 1 4.5 14.25v-7.5A2.25 2.25 0 0 1 6.75 4.5h6.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>
</section>
